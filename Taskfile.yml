# Project tasks (go-task v3). The engine keeps its state in a SQLite file
# under DATA_DIR, so there is no database service to start for development.

version: "3"

silent: true

# The binaries load .env themselves (godotenv); this makes it reach bare
# `go test` and npm scripts too.
dotenv: [".env"]

vars:
  VERSION:
    sh: git describe --tags --dirty 2>/dev/null || echo v0.0.0-dev
  LDFLAGS: -X github.com/Hinkolas/presso/internal/version.Version={{.VERSION}}

tasks:
  # --- Build ---

  build:
    desc: Build the web UI and the pressod binary (UI embedded) into bin/
    deps: [build:web]
    cmds:
      - go build -ldflags "{{.LDFLAGS}}" -o bin/pressod ./cmd/pressod

  build:go:
    desc: Build only the pressod binary (uses whatever internal/webui/dist holds)
    cmds:
      - go build -ldflags "{{.LDFLAGS}}" -o bin/pressod ./cmd/pressod

  build:web:
    desc: Build the SvelteKit SPA and copy it into internal/webui/dist for embedding
    dir: web
    cmds:
      - npm ci --no-audit --no-fund
      - npm run build
      - rm -rf ../internal/webui/dist && mkdir -p ../internal/webui/dist
      - cp -R build/. ../internal/webui/dist/
      - touch ../internal/webui/dist/.gitkeep

  build:edge:
    desc: Build the presso-edge:dev image (Caddy + Souin page cache)
    cmds:
      - docker build -t presso-edge:dev -f build/edge.Dockerfile build

  build:services:
    desc: Build the presso-mariadb, presso-valkey and presso-browser :dev images
    cmds:
      - for image in mariadb valkey browser; do docker build -t "presso-$image:dev" -f "build/$image.Dockerfile" build; done

  smoke:services:
    desc: Smoke-test the locally built platform images (task build:edge build:services first)
    cmds:
      - for image in edge mariadb valkey browser; do build/smoke.sh "$image" "presso-$image:dev"; done

  build:image:
    desc: Build the pressod:dev image from this checkout (needs docker)
    cmds:
      - docker build -t pressod:dev -f build/pressod.Dockerfile .

  # --- Release ---
  # Releases are cut by pushing a version tag; .github/workflows/release.yml
  # runs goreleaser, builds the edge and runtime images under that tag and
  # publishes the GitHub release last. These two rehearse the binary part.
  release:check:
    desc: Validate .goreleaser.yaml
    cmds:
      - goreleaser check

  release:snapshot:
    desc: Build the release artifacts locally into dist/ (no tag, no publish)
    cmds:
      - goreleaser release --snapshot --clean --skip=publish

  release:tag:
    desc: "Tag and push a release: task release:tag V=v0.1.0"
    env:
      PRESSO_RELEASE_VERSION: '{{.V | default ""}}'
    preconditions:
      - sh: test -n "$PRESSO_RELEASE_VERSION"
        msg: "pass the version: task release:tag V=v0.1.0"
      - sh: go run ./cmd/release-version "$PRESSO_RELEASE_VERSION" >/dev/null
        msg: "use vX.Y.Z or vX.Y.Z-{alpha,beta,rc}.N (for example v0.1.0-rc.1); no leading zeros or build metadata"
      - sh: git diff --quiet && git diff --cached --quiet
        msg: "commit or stash your changes first"
    cmds:
      - git tag -a "$PRESSO_RELEASE_VERSION" -m "$PRESSO_RELEASE_VERSION"
      - git push origin "refs/tags/$PRESSO_RELEASE_VERSION"

  # Runtime images are two-stage: one base per PHP version (FrankenPHP for
  # >= 8.2, nginx + PHP-FPM below) and a thin WordPress layer per tag. CI
  # publishes the full matrix to ghcr.io (.github/workflows/runtime.yml);
  # these build single tags locally (RUNTIME_IMAGE_TEMPLATE=presso-runtime:...).
  build:runtime:base:
    desc: "Build presso-runtime-base:php{PHP} (default 8.5); PHP < 8.2 picks the FPM flavor"
    vars:
      PHP: '{{.PHP | default "8.5"}}'
    cmds:
      - |
        # The exact PHP release comes from the compat matrix, like in CI.
        patch=$(jq -er --arg php "{{.PHP}}" '.php[] | select(.version == $php) | .patch' internal/compat/matrix.json) \
          || { echo "PHP {{.PHP}} is not in internal/compat/matrix.json" >&2; exit 1; }
        case "{{.PHP}}" in
          7.4|8.0) docker build -f runtime/base-legacy.Dockerfile --build-arg PHP_VERSION={{.PHP}} --build-arg PHP_PATCH="$patch" --build-arg DEBIAN=bullseye -t presso-runtime-base:php{{.PHP}} runtime ;;
          8.1)     docker build -f runtime/base-legacy.Dockerfile --build-arg PHP_VERSION={{.PHP}} --build-arg PHP_PATCH="$patch" --build-arg DEBIAN=bookworm -t presso-runtime-base:php{{.PHP}} runtime ;;
          *)       docker build -f runtime/base.Dockerfile --build-arg PHP_VERSION={{.PHP}} --build-arg PHP_PATCH="$patch" -t presso-runtime-base:php{{.PHP}} runtime ;;
        esac

  build:runtime:
    desc: "Build presso-runtime:php{PHP}-wp{WP} (defaults 8.5 / 7.1) on top of its base"
    vars:
      PHP: '{{.PHP | default "8.5"}}'
      WP: '{{.WP | default "7.1"}}'
    deps:
      - task: build:runtime:base
        vars: { PHP: "{{.PHP}}" }
    cmds:
      - docker build --build-arg BASE_IMAGE=presso-runtime-base:php{{.PHP}} --build-arg WP_VERSION={{.WP}} -t presso-runtime:php{{.PHP}}-wp{{.WP}} runtime

  runtime:matrix:
    desc: "Print the runtime image build matrix as JSON (add -- --bases or -- --legacy=false)"
    cmds:
      - go run ./cmd/pressod runtime-matrix {{.CLI_ARGS}}

  # --- Dev loop ---

  dev:
    desc: Run the engine API (takes over :7080; migrates on boot)
    cmds:
      # Free the port first so a restart always wins, whatever started the
      # previous instance. 7080 mirrors the HTTP_ADDR default.
      - lsof -ti :7080 | xargs kill 2>/dev/null || true
      - go run ./cmd/pressod serve

  dev:web:
    desc: Run the SvelteKit dev server (proxies /api to the engine on :7080)
    dir: web
    cmds:
      - npm run dev

  nuke:
    desc: "DEV ONLY: remove every presso-managed container, volume and the network"
    prompt: This removes all presso containers and volumes on this Docker host. Continue?
    cmds:
      - docker ps -aq --filter label=presso.managed=true | xargs -r docker rm -f
      - docker volume ls -q --filter label=presso.managed=true | xargs -r docker volume rm
      - docker network rm presso 2>/dev/null || true

  user:
    desc: "Manage operator accounts, e.g. task user -- create --email you@example.com --role admin"
    cmds:
      - go run ./cmd/pressod user {{.CLI_ARGS}}

  # --- Code generation ---

  generate:
    desc: Regenerate the sqlc store from migrations/ and query/
    cmds:
      - sqlc generate

  # --- Checks ---

  check:secrets:
    desc: Scan all local Git history and publishable files (requires Gitleaks 8.30.1)
    cmds:
      - python3 scripts/check_secrets.py

  check:deps:
    desc: Check Go and npm advisories (requires govulncheck 1.9.0 and installed web dependencies)
    cmds:
      - go mod verify
      - govulncheck ./cmd/... ./internal/... ./migrations/...
      - npm --prefix web audit --audit-level=low

  check:security:
    desc: Run credential and dependency checks (requires Gitleaks and govulncheck)
    cmds:
      - task: check:secrets
      - task: check:deps

  test:
    desc: Run the Go test suite (SQLite in temp dirs; nothing to start)
    cmds:
      # web/ is excluded: node_modules occasionally ships stray Go packages.
      - go test $(go list ./... | grep -v '/web/')

  vet:
    desc: go vet
    cmds:
      - go vet $(go list ./... | grep -v '/web/')

  check:web:
    desc: Type-check and lint the web UI
    dir: web
    cmds:
      - npm run check
      - npm run lint

  check:
    desc: Run Go tests, vet, and frontend checks
    cmds:
      - task: vet
      - task: test
      - task: check:web
