title = "presso secret scanning"
minVersion = "8.30.1"

[extend]
useDefault = true

# Exact source expressions reviewed during the pre-publication history audit.
# Keep the default rules, including for every test and example file.
[[rules]]
id = "generic-api-key"

[[rules.allowlists]]
description = "Literal WordPress table prefix beside the runtime password expression"
condition = "AND"
paths = ['''(^|/)internal/site/container\.go$''']
regexTarget = "secret"
regexes = ['''^PRESSO_DB_PREFIX=wp_$''']

[[rules.allowlists]]
description = "Literal Valkey memory limit default, not an API credential"
condition = "AND"
paths = ['''(^|/)internal/config/config\.go$''']
regexTarget = "secret"
regexes = ['''^default=256mb$''']
