# Checks and tests that need no image builds: vet, race tests, the installer,
# the frontend and the compliance tooling (including a real source bundle for
# the engine binary). Run for every pull request by ci.yml and before every
# release by release.yml, which also runs image-verification.yml.
name: verify

on:
  workflow_call:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # web/ is excluded like task test: node_modules occasionally ships
      # stray Go packages.
      - run: go vet $(go list ./... | grep -v '/web/')
      - run: go test -race $(go list ./... | grep -v '/web/')

  install-script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: ruby scripts/check-release-gates.rb
      - run: python3 -m unittest discover -s scripts -p 'test_ci_changes.py' -v
      - run: bash -n install.sh
      - run: shellcheck --severity=warning install.sh

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - run: npm run build

  compliance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: python3 -m unittest discover -s scripts/compliance -p 'test_*.py' -v
      - run: cd web && npm ci && npm run build
      - name: Rehearse real binary source and notice collection
        run: |
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -o /tmp/pressod ./cmd/pressod
          python3 scripts/compliance/collect.py binary /tmp/pressod --out /tmp/engine-compliance
          python3 scripts/compliance/collect.py verify /tmp/engine-compliance

