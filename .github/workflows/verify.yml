name: verify

on:
  workflow_call:
    inputs:
      sources:
        description: Collect and verify the image source bundles (the slowest check)
        type: boolean
        default: true
      cache:
        description: "Docker layer cache: off, use (read and write) or refresh (write only)"
        type: string
        default: "off"

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # web/ is excluded like task test: node_modules occasionally ships
      # stray Go packages.
      - run: go vet $(go list ./... | grep -v '/web/')
      - run: go test -race $(go list ./... | grep -v '/web/')

  install-script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: ruby scripts/check-release-gates.rb
      - run: python3 -m unittest discover -s scripts -p 'test_ci_changes.py' -v
      - run: bash -n install.sh
      - run: shellcheck --severity=warning install.sh

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - run: npm run build

  compliance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: python3 -m unittest discover -s scripts/compliance -p 'test_*.py' -v
      - run: cd web && npm ci && npm run build
      - name: Rehearse real binary source and notice collection
        run: |
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -o /tmp/pressod ./cmd/pressod
          python3 scripts/compliance/collect.py binary /tmp/pressod --out /tmp/engine-compliance
          python3 scripts/compliance/collect.py verify /tmp/engine-compliance

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Verify source helper ownership on Linux
        run: PRESSO_TEST_DOCKER=1 python3 -m unittest discover -s scripts/compliance -p 'test_alpine_helper.py' -v
      - name: Resolve the default published runtime
        run: |
          set -euo pipefail
          go run ./cmd/pressod runtime-matrix > /tmp/presso-matrix.json
          go run ./cmd/pressod runtime-matrix --bases > /tmp/presso-bases.json
          php=$(jq -r '.include[0].php' /tmp/presso-matrix.json)
          {
            echo "PHP_VERSION=$php"
            echo "PHP_PATCH=$(jq -er --arg php "$php" '.include[] | select(.php == $php) | .patch' /tmp/presso-bases.json)"
            echo "WP_VERSION=$(jq -r '.include[0].wp' /tmp/presso-matrix.json)"
          } >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      # docker-bake.hcl: the platform images and the runtime, in parallel.
      - name: Build the verification images
        uses: docker/bake-action@v6
        env:
          CACHE: ${{ inputs.cache != 'off' && 'gha' || '' }}
        with:
          source: .
          load: true
          no-cache: ${{ inputs.cache == 'refresh' }}
      - name: Verify real image source and notice collection
        if: ${{ inputs.sources }}
        run: |
          set -euo pipefail
          for image in edge mariadb valkey browser runtime; do
            python3 scripts/compliance/collect.py image "presso-$image:release-verification" --out "/tmp/$image-compliance"
            python3 scripts/compliance/collect.py verify "/tmp/$image-compliance"
            rm -rf "/tmp/$image-compliance"
          done
      - name: Smoke-test the platform images
        run: |
          set -euo pipefail
          for image in edge mariadb valkey browser; do
            build/smoke.sh "$image" "presso-$image:release-verification"
          done
      - run: docker pull curlimages/curl:latest
      - run: go test -tags integration -count=1 -timeout 10m ./internal/integration ./internal/platform
