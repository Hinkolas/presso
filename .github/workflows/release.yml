# Cuts a release from a version tag (v0.1.0, v0.2.0-rc.1, ...). One tag names
# everything: the pressod binary on the GitHub release, the platform images
# (edge, MariaDB, Valkey, browser; build/*.Dockerfile) and the runtime images
# on ghcr.io all carry it, and the engine derives its image references from
# its own version (see docs/orchestration.md "Release and update").
#
# The GitHub release is created as a draft by goreleaser and published by the
# last job, after every image has been pushed and smoke-tested. Hosts read
# the release list, where drafts are invisible without a token and skipped
# anyway, so an update is only ever offered once all of its parts exist.
name: release

on:
  push:
    tags: ["v*"] # Broad trigger; validate-tag enforces the exact version syntax.

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  # Platform images are published as $REGISTRY/presso-<image>:<tag>.
  REGISTRY: ghcr.io/hinkolas

jobs:
  validate-tag:
    runs-on: ubuntu-latest
    outputs:
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          prerelease=$(go run ./cmd/release-version "$TAG")
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

  verify:
    needs: validate-tag
    uses: ./.github/workflows/verify.yml

  security:
    needs: validate-tag
    uses: ./.github/workflows/security.yml

  # Image builds, source collection and the Docker integration tests.
  verify-images:
    needs: validate-tag
    uses: ./.github/workflows/image-verification.yml

  source-release:
    needs: [verify, verify-images, security]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Prepare public source distribution
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/compliance/release.py prepare --release "$GITHUB_REF_NAME"

  binary:
    needs: [verify, source-release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # goreleaser reads tags and the changelog range
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRESSO_PUBLISH_SOURCES: "1"

  # One job per platform image and architecture, built natively. Sources are
  # verified and published before the per-arch image is pushed, then the
  # image is smoke-tested the way pressod starts it (build/smoke.sh).
  images:
    needs: [verify, source-release]
    strategy:
      fail-fast: false
      matrix:
        image: [edge, mariadb, valkey, browser]
        arch: [amd64, arm64]
        include:
          - {arch: amd64, runner: ubuntu-latest}
          - {arch: arm64, runner: ubuntu-24.04-arm}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: build
          file: build/${{ matrix.image }}.Dockerfile
          tags: presso-${{ matrix.image }}:built
          load: true
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }}
          cache-to: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }},mode=max
      - name: Verify and publish sources before the image
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ${{ matrix.image }}
          ARCH: ${{ matrix.arch }}
        run: |
          python3 scripts/compliance/release.py image --image "presso-$IMAGE:built" \
            --target "$REGISTRY/presso-$IMAGE:$GITHUB_REF_NAME-$ARCH" --release "$GITHUB_REF_NAME" \
            --output "/tmp/$IMAGE-source-assets" --push
      - name: Smoke-test the published image
        env:
          IMAGE: ${{ matrix.image }}
          ARCH: ${{ matrix.arch }}
        run: build/smoke.sh "$IMAGE" "$REGISTRY/presso-$IMAGE:$GITHUB_REF_NAME-$ARCH"

  images-merge:
    needs: [images]
    strategy:
      fail-fast: false
      matrix:
        image: [edge, mariadb, valkey, browser]
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - env:
          IMAGE: ${{ matrix.image }}
        run: |
          ref="$REGISTRY/presso-$IMAGE:$GITHUB_REF_NAME"
          docker buildx imagetools create -t "$ref" "$ref-amd64" "$ref-arm64"

  runtime:
    needs: [verify, source-release]
    uses: ./.github/workflows/runtime.yml
    with:
      release: ${{ github.ref_name }}
    secrets: inherit

  publish:
    needs: [validate-tag, verify, verify-images, security, source-release, binary, images, images-merge, runtime]
    runs-on: ubuntu-latest
    steps:
      - name: Publish the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.validate-tag.outputs.prerelease }}
        run: |
          set -euo pipefail
          # Plain v0.x.y versions are releases during initial development.
          # Only validated alpha/beta/rc suffixes are GitHub prereleases.
          case "$PRERELEASE" in
            true) gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease --latest=false ;;
            false) gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease=false --latest ;;
            *) echo "Invalid or missing prerelease classification" >&2; exit 1 ;;
          esac
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease,assets --jq '{isDraft,isPrerelease,assets:[.assets[].name]}'
