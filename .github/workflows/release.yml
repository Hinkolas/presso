# Cuts a release from a version tag (v0.1.0, v0.2.0-rc.1, ...). One tag names
# everything: the pressod binary on the GitHub release, the edge image and the
# runtime images on ghcr.io all carry it, and the engine derives its image
# references from its own version (see ORCHESTRATION.md "Release and update").
#
# The GitHub release is created as a draft by goreleaser and published by the
# last job, after every image has been pushed and smoke-tested. Hosts poll
# /releases/latest, which never returns drafts, so an update is only ever
# offered once all of its parts exist.
name: release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  EDGE_IMAGE: ghcr.io/hinkolas/presso-edge

jobs:
  verify:
    uses: ./.github/workflows/verify.yml

  source-release:
    needs: [verify]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare public source distribution
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/compliance/release.py prepare --release "$GITHUB_REF_NAME"

  binary:
    needs: [verify, source-release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # goreleaser reads tags and the changelog range
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRESSO_PUBLISH_SOURCES: "1"

  edge:
    needs: [verify, source-release]
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arch: amd64, runner: ubuntu-latest}
          - {arch: arm64, runner: ubuntu-24.04-arm}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: build
          file: build/edge.Dockerfile
          tags: presso-edge:built
          load: true
          cache-from: type=gha,scope=edge-${{ matrix.arch }}
          cache-to: type=gha,scope=edge-${{ matrix.arch }},mode=max
      - name: Verify and publish sources before the edge image
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARCH: ${{ matrix.arch }}
        run: |
          python3 scripts/compliance/release.py image --image presso-edge:built \
            --target "$EDGE_IMAGE:$GITHUB_REF_NAME-$ARCH" --release "$GITHUB_REF_NAME" \
            --output /tmp/edge-source-assets --push
      - name: Smoke-test the documented edge image
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          docker run --rm "$EDGE_IMAGE:$GITHUB_REF_NAME-$ARCH" caddy version
          docker run --rm "$EDGE_IMAGE:$GITHUB_REF_NAME-$ARCH" caddy list-modules | grep -q '^http.handlers.cache$'

  edge-merge:
    needs: [edge]
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: docker buildx imagetools create -t "$EDGE_IMAGE:$GITHUB_REF_NAME" "$EDGE_IMAGE:$GITHUB_REF_NAME-amd64" "$EDGE_IMAGE:$GITHUB_REF_NAME-arm64"

  runtime:
    needs: [verify, source-release]
    uses: ./.github/workflows/runtime.yml
    with:
      release: ${{ github.ref_name }}
    secrets: inherit

  publish:
    needs: [verify, source-release, binary, edge, edge-merge, runtime]
    runs-on: ubuntu-latest
    steps:
      - name: Publish the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Every pre-1.0 release is experimental, even without a suffix.
          # Explicitly exclude prereleases from "latest" as well.
          if [[ "$TAG" == v0.* || "$TAG" == *-* ]]; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease --latest=false
          else
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
          fi
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease,assets --jq '{isDraft,isPrerelease,assets:[.assets[].name]}'
