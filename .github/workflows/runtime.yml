# Builds and publishes the runtime images (docs/runtime.md "Container structure").
# Two stages: one base per PHP version (FrankenPHP >= 8.2, nginx + PHP-FPM
# below), built natively per architecture and merged into a multi-arch tag,
# then one thin WordPress layer per php/wp pair. The pair list is the compat
# matrix in internal/compat filtered by its "build" policy (currently one
# branch per WordPress major on its newest PHP), printed by
# `pressod runtime-matrix`. Widen the policy in matrix.json to build more.
#
# Images are published per engine release and carry the release tag:
# <IMAGE>:<release>-php8.5-wp7.1. The release workflow calls this one with the
# tag; every release rebuilds the bases, which is how OS security updates
# reach sites (no more moving tags, so an existing host is never surprised by
# an image that changed under the same name). PHP itself is pinned to an exact
# patch release per branch in matrix.json ("patch"); a PHP security release
# means bumping that pin, and the base build fails if the image disagrees.
#
# Pull requests (and dispatches with push=false) build sample pairs, one per
# published flavor, on amd64 only and smoke-test them without pushing. The
# legacy flavor is currently unpublished (README.md "Legacy runtimes").
name: runtime

on:
  workflow_call:
    inputs:
      release:
        description: Release tag the images are published under (e.g. v0.1.0)
        type: string
        required: true
  pull_request:
    branches: [main]
    paths:
      - runtime/**
      - scripts/compliance/**
      - docs/licensing.md
      - internal/compat/matrix.json
      - .github/workflows/runtime.yml
  workflow_dispatch:
    inputs:
      release:
        description: Release tag (v0.1.0 or v0.1.0-rc.1); dev is allowed only with push=false
        type: string
        required: true
      legacy:
        description: Include the nginx + PHP-FPM versions (7.4, 8.0, 8.1) the build policy publishes
        type: boolean
        default: true
      push:
        description: Push to ghcr.io (false = build the samples only)
        type: boolean
        default: true

permissions:
  contents: write
  packages: write

env:
  IMAGE: ghcr.io/hinkolas/presso-runtime
  BASE_IMAGE: ghcr.io/hinkolas/presso-runtime-base
  RELEASE: ${{ inputs.release }}
  SAMPLE_TAGS: php8.5-wp7.1

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      bases: ${{ steps.gen.outputs.bases }}
      base_runs: ${{ steps.gen.outputs.base_runs }}
      pairs: ${{ steps.gen.outputs.pairs }}
      pair_runs: ${{ steps.gen.outputs.pair_runs }}
      samples: ${{ steps.gen.outputs.samples }}
      push: ${{ steps.gen.outputs.push }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - id: gen
        env:
          EVENT: ${{ github.event_name }}
          IN_LEGACY: ${{ inputs.legacy }}
          IN_PUSH: ${{ inputs.push }}
        run: |
          set -euo pipefail
          flags=""
          if [ "$EVENT" = workflow_dispatch ] && [ "$IN_LEGACY" = false ]; then flags="--legacy=false"; fi
          bases=$(go run ./cmd/pressod runtime-matrix --bases $flags)
          pairs=$(go run ./cmd/pressod runtime-matrix $flags)
          echo "bases=$(jq -c . <<<"$bases")" >> "$GITHUB_OUTPUT"
          # Bases are built once per architecture on native runners.
          echo "base_runs=$(jq -c '.include |= (map(. as $b | ["ubuntu-latest","ubuntu-24.04-arm"] | map($b + {runner: .})) | add)' <<<"$bases")" >> "$GITHUB_OUTPUT"
          echo "pairs=$(jq -c . <<<"$pairs")" >> "$GITHUB_OUTPUT"
          echo "pair_runs=$(jq -c '.include |= (map(. as $p | [{arch: "amd64", runner: "ubuntu-latest"}, {arch: "arm64", runner: "ubuntu-24.04-arm"}] | map($p + .)) | add)' <<<"$pairs")" >> "$GITHUB_OUTPUT"
          # Samples: one pair per flavor, joined with its base for a one-runner build.
          echo "samples=$(jq -c --argjson bases "$bases" --arg tags "$SAMPLE_TAGS" '
            .include |= map(select(.tag as $t | ($tags | split(" ")) | index($t)))
            | .include |= map(. as $p | $p + ($bases.include[] | select(.php == $p.php) | {patch, debian, dockerfile}))
          ' <<<"$pairs")" >> "$GITHUB_OUTPUT"
          push=false
          case "$EVENT" in
            # Called from the release workflow (the caller's event is the tag push).
            push) push=true ;;
            workflow_dispatch) [ "$IN_PUSH" = true ] && push=true ;;
          esac
          if [ "$push" = true ] && [ -z "$RELEASE" ]; then
            echo "::error::a release tag prefix is required to publish" >&2
            exit 1
          fi
          if [ "$push" = true ]; then go run ./cmd/release-version "$RELEASE" >/dev/null; fi
          echo "push=$push" >> "$GITHUB_OUTPUT"

  # --- Publishing path -------------------------------------------------------

  source-release:
    needs: matrix
    if: needs.matrix.outputs.push == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare public source distribution
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/compliance/release.py prepare --release "$RELEASE"

  base:
    needs: [matrix, source-release]
    if: needs.matrix.outputs.push == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.base_runs) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: runtime
          file: ${{ matrix.dockerfile }}
          build-args: |
            PHP_VERSION=${{ matrix.php }}
            PHP_PATCH=${{ matrix.patch }}
            ${{ matrix.debian && format('DEBIAN={0}', matrix.debian) || '' }}
          tags: presso-runtime-base:built
          load: true
          cache-from: type=gha,scope=base-php${{ matrix.php }}-${{ matrix.runner }}
          cache-to: type=gha,scope=base-php${{ matrix.php }}-${{ matrix.runner }},mode=max
      - name: Verify and publish sources before the base image
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PHP: ${{ matrix.php }}
          RUNNER: ${{ matrix.runner }}
        run: |
          set -euo pipefail
          target="$BASE_IMAGE:$RELEASE-php$PHP-$RUNNER"
          python3 scripts/compliance/release.py image --image presso-runtime-base:built \
            --target "$target" --release "$RELEASE" --output /tmp/base-source-assets --push
          mkdir -p /tmp/digests
          docker image inspect "$target" --format '{{index .RepoDigests 0}}' | sed 's/.*@//' > "/tmp/digests/$RUNNER"
      - uses: actions/upload-artifact@v4
        with:
          name: base-digest-php${{ matrix.php }}-${{ matrix.runner }}
          path: /tmp/digests/*
          retention-days: 1

  base-merge:
    needs: [matrix, base]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.bases) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: base-digest-php${{ matrix.php }}-*
          path: /tmp/digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          set -euo pipefail
          refs=""
          for f in /tmp/digests/*; do refs="$refs $BASE_IMAGE@$(cat "$f")"; done
          docker buildx imagetools create -t "$BASE_IMAGE:$RELEASE-php${{ matrix.php }}" $refs
          docker buildx imagetools inspect "$BASE_IMAGE:$RELEASE-php${{ matrix.php }}"

  image:
    needs: [matrix, base-merge]
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJSON(needs.matrix.outputs.pair_runs) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Native runners permit inspecting the exact PHP/PHAR shipped per arch.
      - uses: docker/build-push-action@v6
        with:
          context: runtime
          file: runtime/Dockerfile
          build-args: |
            BASE_IMAGE=${{ env.BASE_IMAGE }}:${{ env.RELEASE }}-php${{ matrix.php }}
            WP_VERSION=${{ matrix.wp }}
          tags: presso-runtime:built
          load: true
      - name: Verify and publish sources before the site image
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PAIR: ${{ matrix.tag }}
          ARCH: ${{ matrix.arch }}
        run: |
          python3 scripts/compliance/release.py image --image presso-runtime:built \
            --target "$IMAGE:$RELEASE-$PAIR-$ARCH" --release "$RELEASE" \
            --output /tmp/runtime-source-assets --push

  image-merge:
    needs: [matrix, image]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.pairs) }}
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - env:
          PAIR: ${{ matrix.tag }}
        run: docker buildx imagetools create -t "$IMAGE:$RELEASE-$PAIR" "$IMAGE:$RELEASE-$PAIR-amd64" "$IMAGE:$RELEASE-$PAIR-arm64"

  verify:
    needs: [matrix, image-merge]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.samples) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: runtime/scripts/smoke.sh "$IMAGE:$RELEASE-${{ matrix.tag }}"

  # --- Pull requests: build and smoke-test one sample per flavor -------------

  sample:
    needs: matrix
    if: needs.matrix.outputs.push != 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.samples) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: runtime
          file: ${{ matrix.dockerfile }}
          build-args: |
            PHP_VERSION=${{ matrix.php }}
            PHP_PATCH=${{ matrix.patch }}
            ${{ matrix.debian && format('DEBIAN={0}', matrix.debian) || '' }}
          tags: presso-runtime-base:php${{ matrix.php }}
          load: true
          cache-from: type=gha,scope=base-php${{ matrix.php }}-ubuntu-latest
      # Docker's own builder: buildx's container builder cannot use the
      # base just loaded into the local image store.
      - name: Build the WordPress layer
        env:
          PHP: ${{ matrix.php }}
          WP: ${{ matrix.wp }}
          PAIR: ${{ matrix.tag }}
        run: |
          docker buildx build --builder "$(docker context show)" -f runtime/Dockerfile \
            --build-arg BASE_IMAGE="presso-runtime-base:php$PHP" --build-arg WP_VERSION="$WP" \
            -t "presso-runtime:$PAIR" runtime
      - name: Rehearse source and notice packaging without publication
        env:
          PAIR: ${{ matrix.tag }}
        run: |
          python3 scripts/compliance/release.py image --image "presso-runtime:$PAIR" \
            --target "presso-runtime:documented-$PAIR" --release "${RELEASE:-dev}" \
            --output /tmp/sample-source-assets
      - run: runtime/scripts/smoke.sh "presso-runtime:documented-${{ matrix.tag }}"
