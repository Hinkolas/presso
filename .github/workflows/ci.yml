# Checks and tests for pull requests into main, which is protected: changes
# land through semantic branches (feat/, fix/, chore/, ...) and a pull request
# whose "ci-result" check passed. Feature-branch pushes run nothing on their
# own; security.yml also scans main pushes and runs on a weekly schedule.
#
# Image builds, source collection and the Docker integration tests live in
# image-verification.yml, which release tags run before publishing anything
# and which can be dispatched by hand before tagging.
name: ci
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      run_verify: ${{ steps.scope.outputs.run_verify }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - id: scope
        run: python3 scripts/ci_changes.py

  verify:
    needs: changes
    # A broken detector must never silently suppress verification. Only a
    # successful, explicit docs-only result may skip this reusable workflow.
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.run_verify != 'false') }}
    uses: ./.github/workflows/verify.yml

  security:
    # Secret scans must also run for documentation-only pull requests.
    uses: ./.github/workflows/security.yml

  # The one check branch protection requires: jobs inside verify.yml are
  # named per run, and a skipped docs-only verification must still pass.
  result:
    name: ci-result
    needs: [changes, verify, security]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - env:
          CHANGES: ${{ needs.changes.result }}
          RUN_VERIFY: ${{ needs.changes.outputs.run_verify }}
          VERIFY: ${{ needs.verify.result }}
          SECURITY: ${{ needs.security.result }}
        run: |
          if [ "$CHANGES" != success ]; then
            echo "::error::change detection $CHANGES"
            exit 1
          fi
          if [ "$SECURITY" != success ]; then
            echo "::error::security verification $SECURITY"
            exit 1
          fi
          case "$VERIFY" in
            success) ;;
            skipped) [ "$RUN_VERIFY" = false ] || { echo "::error::verification was skipped"; exit 1; } ;;
            *) echo "::error::verification $VERIFY"; exit 1 ;;
          esac
