; presso-runtime PHP overrides, layered on php.ini-production. Applies to the
; web server (FrankenPHP or php-fpm) and WP-CLI alike. Per-site limits (memory,
; uploads, timezone, OPcache sizing) are set for web requests from env instead:
; in the Caddyfile, or for the FPM flavor in the rendered /run/presso/php/site.ini.

; Nothing identifies the stack; errors never reach the browser. error_log is
; deliberately left unset: PHP then hands messages to the SAPI, which in
; FrankenPHP is Caddy's stderr logger (one JSON line per message, with level
; and timestamp, on the same stream as the access log) and plain stderr for
; WP-CLI. The system plugin's own JSON lines therefore arrive as the "msg"
; field of a {"logger":"frankenphp"} record.
expose_php = Off
log_errors = On
display_errors = Off
html_errors = Off

; OPcache (docs/runtime.md section 2): timestamps are validated so plugin updates
; written by WP-CLI (a separate process) become visible without a restart.
; revalidate_freq is set per site (Caddyfile / site.ini). The file limit is well
; above the default because core + WooCommerce alone is thousands of files.
; JIT is off: low single-digit gain for WordPress, history of edge-case bugs.
opcache.enable = 1
opcache.enable_cli = 1
opcache.validate_timestamps = 1
opcache.max_accelerated_files = 30000
opcache.interned_strings_buffer = 32
opcache.jit = off
opcache.jit_buffer_size = 0

; Core sits at the same path in every container; cache resolved paths longer.
realpath_cache_size = 4096K
realpath_cache_ttl = 600

; CLI headroom: WP-CLI extracts core and plugin zips in memory and WordPress
; only raises the limit once it is loaded. Web requests do not see this value;
; the web server sets memory_limit per site (PHP_MEMORY_LIMIT, default 256M).
memory_limit = 512M

; The only writable scratch space for the `web` user besides uploads/cache.
session.save_path = /tmp
sys_temp_dir = /tmp
upload_tmp_dir = /tmp
