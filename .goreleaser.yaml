# Release build of pressod (.github/workflows/release.yml, on tags v*).
# The web UI is built first and embedded; the binary is a static Linux build
# for amd64 and arm64. The GitHub release is created as a DRAFT: the workflow
# publishes it only after the edge and runtime images for the same tag exist,
# so a host's update check never sees a release whose images are missing.
#
# Local dry run: task release:snapshot (artifacts under dist/).
version: 2

project_name: pressod

before:
  hooks:
    - sh -c "cd web && npm ci --no-audit --no-fund && npm run build"
    - sh -c "rm -rf internal/webui/dist && mkdir -p internal/webui/dist && cp -R web/build/. internal/webui/dist/ && touch internal/webui/dist/.gitkeep"

builds:
  - id: pressod
    main: ./cmd/pressod
    binary: pressod
    env:
      - CGO_ENABLED=0
    goos: [linux]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X github.com/Hinkolas/presso/internal/version.Version={{ .Tag }}
    hooks:
      post:
        - cmd: python3 scripts/compliance/release.py binary --binary {{ .Path }} --arch {{ .Arch }} --release {{ .Tag }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: tarball
    formats: [tar.gz]
    # Must match internal/update assetNames: pressod_<tag>_linux_<arch>.tar.gz
    name_template: "{{ .ProjectName }}_{{ .Tag }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE
      - NOTICE
      - docs/licensing.md
      - src: compliance-output/binary_{{ .Arch }}/THIRD_PARTY_LICENSES.txt
        dst: THIRD_PARTY_LICENSES.txt
      - src: compliance-output/binary_{{ .Arch }}/SOURCE_BUNDLE
        dst: SOURCE_BUNDLE
      - docs/license-review/review.md
      - docs/license-review/inventory.json
      - docs/license-review/valkey.md
      - docs/license-review/source-delivery.md
      - web/static/third-party-licenses.txt
      - SECURITY.md
      - CONTRIBUTING.md
      - ROADMAP.md
      - .env.example
      - docs/orchestration.md
      - docs/runtime.md
      - docs/harness.md
      - docs/release-verification.md
      - runtime/dropins/COPYING
      - runtime/dropins/README.md

checksum:
  # Must match internal/update assetNames: pressod_<tag>_checksums.txt
  name_template: "{{ .ProjectName }}_{{ .Tag }}_checksums.txt"
  algorithm: sha256

changelog:
  use: github
  sort: asc
  groups:
    - title: Features
      regexp: '^.*?(feat|add)(\(.+\))??!?:.+$'
      order: 0
    - title: Fixes
      regexp: '^.*?fix(\(.+\))??!?:.+$'
      order: 1
    - title: Other
      order: 999
  filters:
    exclude:
      - "^docs"
      - "^chore"
      - "^ci"

release:
  github:
    owner: Hinkolas
    name: presso
  draft: true
  # Only alpha/beta/rc suffixes mark drafts as prereleases. Plain v0.x.y tags
  # are normal releases during initial development, eligible for latest.
  prerelease: auto
  extra_files:
    - glob: ./install.sh
  header: |
    **Before v1.0.0: initial development, not recommended for production workloads.**
    Pre-1.0 releases may introduce breaking changes, downtime, and data loss.
    Automated backups, restore, rollback, and managed WordPress/plugin security
    updates are not available yet. Original presso code is provided as-is under
    Apache 2.0; bundled dependencies retain their licenses.

    Matching source bundles and notices: https://github.com/Hinkolas/presso/releases/tag/sources-{{ .Tag }}

    Install or upgrade to this exact release with:

    ```sh
    curl -fsSL https://github.com/Hinkolas/presso/releases/download/{{ .Tag }}/install.sh | sudo bash -s -- --version {{ .Tag }}
    ```

    The panel's **System → Updates** uses the stable release feed; for prereleases,
    select a version explicitly with the installer above. Images for this release:
    `ghcr.io/hinkolas/presso-edge:{{ .Tag }}` and
    `ghcr.io/hinkolas/presso-runtime:{{ .Tag }}-php<php>-wp<wp>`.
